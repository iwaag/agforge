schema = "ag.agent-config.v2"
project = "agforge"

[models."ollama/qwen3.8:27b-mlx-bf16"]

[models."anthropic/claude-sonnet-5"]

[models."antigravity/gemini-3.8-flash-medium"]

[models."antigravity/claude-sonnet-4-6"]

[profiles.local]
harness = "agcode"
model = "ollama/qwen3.8:27b-mlx-bf16"

[profiles.sonnet]
harness = "claude_code"
model = "anthropic/claude-sonnet-5"

[profiles.stub]
harness = "fake"
model = "ollama/qwen3.8:27b-mlx-bf16"

# Google's Antigravity CLI (`agy`), headless. The catalog is the Antigravity
# account's — Gemini and Claude alike — so the provider is `antigravity` and
# the record says which model ran (Agent ≠ Model). The CLI carries its own
# OAuth token; a run reports tokens, no cost.
#
# These are the profiles behind forge's **published execution options**
# (`instance.PUBLIC_PROFILES`). They change which model reasons about a
# request and drives the toolsets — never which media model generates the
# asset: that is chosen in the plan and named in the toolset, and asking for
# `agy` must not quietly turn a video request into something else.
[profiles.agy]
harness = "agy"
model = "antigravity/gemini-3.8-flash-medium"

[profiles.agy-claude]
harness = "agy"
model = "antigravity/claude-sonnet-4-6"

# The front reads and writes text — and runs `agforge toolsets --list`,
# which its guide tells it to do. `agentchat` is what the entrance serving
# reads the board with. Without a grant claude_code sits on a permission
# prompt until the timeout (ag.agent-config.v2 makes the grant part of the role).
[roles.front]
profile = "sonnet"
requires = []
allowed_tools = "Read,Write,Edit,Glob,Grep,Bash(agforge:*),Bash(agentchat:*)"

# The generator's grant: image/audio tooling, the shell verbs around it, and
# file access inside its workspace. `agforge` and `generate.sh` are reached
# through PATH, so the bare name is what the toolsets name and what is
# allowed here.
[roles.generator]
profile = "sonnet"
requires = []
allowed_tools = [
    "Bash(agforge:*)",
    "Bash(generate.sh:*)", "Bash(scripts/generate.sh:*)",
    "Bash(./scripts/generate.sh:*)",
    "Bash(sh scripts/generate.sh:*)", "Bash(uv:*)", "Bash(python3:*)",
    "Bash(pip:*)", "Bash(curl:*)", "Bash(sips:*)", "Bash(magick:*)",
    "Bash(ffmpeg:*)", "Bash(ffprobe:*)", "Bash(file:*)", "Bash(ls:*)",
    "Bash(pwd:*)", "Bash(cd:*)", "Bash(mkdir:*)", "Bash(cp:*)",
    "Bash(mv:*)", "Bash(rm:*)", "Bash(cat:*)", "Bash(head:*)",
    "Bash(tail:*)", "Bash(wc:*)", "Bash(grep:*)", "Bash(rg:*)",
    "Bash(find:*)", "Bash(sed:*)", "Bash(awk:*)", "Bash(echo:*)",
    "Bash(printf:*)", "Bash(jq:*)", "Bash(date:*)", "Bash(env:*)",
    "Bash(which:*)", "Bash(mc:*)", "Bash(git status:*)",
    "Bash(git log:*)", "Bash(git diff:*)", "Bash(git show:*)",
    "Bash(acestudio-cli:*)",
    "Read", "Write", "Edit", "Glob", "Grep", "WebFetch",
]
