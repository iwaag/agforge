[project]
name = "agforge"
version = "0.1.0"
description = "Asset-generation workspace: prompt-only request service over SwarmUI"
requires-python = ">=3.11"
dependencies = ["pillow", "boto3", "requests", "pyagag"]

[project.scripts]
agforge = "agforge.cli:main"
agforge-request-service = "agforge.request_service:main"
agforge-agent-run = "agforge.agent_run:main"
agforge-transform = "agforge.transform:main"

[dependency-groups]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agforge"]

[tool.uv.sources]
pyagag = { git = "https://github.com/iwaag/pyagag.git", branch = "main" }
